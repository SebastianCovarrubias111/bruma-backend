spring.application.name=bruma-backend
server.port=8080

# ---------- Base de datos (MySQL) ----------
# Se pueden sobreescribir con variables de entorno: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bruma?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ---------- JWT ----------
# En producción define JWT_SECRET con un texto largo y aleatorio (mínimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:cambia-esta-llave-en-produccion-bruma-2026-0123456789}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:30}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}

# ---------- CORS: orígenes del frontend permitidos (separados por coma) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173}

# ---------- Llave para que el servidor Webpay confirme pagos (vacía = deshabilitado) ----------
app.internal-key=${INTERNAL_KEY:}

# ---------- Órdenes pendientes: minutos antes de anularse y devolver stock ----------
app.boletas.expiran-minutos=${BOLETAS_EXPIRAN_MINUTOS:30}

# ---------- Datos de ejemplo ----------
app.seed.enabled=${SEED_ENABLED:true}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
