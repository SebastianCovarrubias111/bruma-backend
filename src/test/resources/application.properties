# Configuración para las pruebas: H2 en memoria, sin depender de MySQL.
spring.datasource.url=jdbc:h2:mem:bruma_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=clave-de-pruebas-clave-de-pruebas-0123456789
app.jwt.access-minutes=30
app.jwt.refresh-days=7
app.cors.allowed-origins=http://localhost:3000
app.internal-key=llave-de-pruebas
app.seed.enabled=true
